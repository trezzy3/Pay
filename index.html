
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0f">
  <title>Acesso | TREZZY PAY</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              400: "#8b5cf6",
              500: "#7c3aed",
              600: "#6d28d9"
            }
          }
        }
      }
    };
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: "Outfit", sans-serif;
      background-color: #0b0b0f;
      color: #f5f5f7;
    }

    .spinner {
      border: 3px solid rgba(139, 92, 246, 0.3);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
  </style>
</head>

<body class="antialiased min-h-screen flex items-center justify-center relative overflow-hidden">

  <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-purple-600/10 blur-[120px] rounded-full"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-purple-600/5 blur-[120px] rounded-full"></div>
  </div>

  <div id="loading-screen" class="relative z-10 flex flex-col items-center justify-center space-y-4">
    <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-purple-600 to-purple-800 p-0.5 shadow-lg shadow-purple-600/20 mb-2">
      <div class="w-full h-full bg-[#14141b] rounded-full flex items-center justify-center text-purple-400 text-3xl">
        <i class="fa-solid fa-cube"></i>
      </div>
    </div>

    <h1 class="font-black text-2xl text-white tracking-tight">
      TREZZY <span class="text-purple-500">PAY</span>
    </h1>

    <div class="spinner my-4"></div>
    <p class="text-sm text-zinc-400 font-medium animate-pulse">Carregando painel...</p>
  </div>

  <div id="login-form" class="relative z-10 w-full max-w-md px-6 hidden opacity-0 transition-opacity duration-700">
    <div class="bg-[#14141b]/90 backdrop-blur-xl border border-[#292933] rounded-3xl p-8 shadow-2xl shadow-black">

      <div class="text-center mb-8">
        <div class="w-16 h-16 mx-auto rounded-full bg-gradient-to-tr from-purple-600 to-purple-800 p-0.5 shadow-lg mb-4">
          <div class="w-full h-full bg-[#0b0b0f] rounded-full flex items-center justify-center text-purple-400 text-2xl">
            <i class="fa-solid fa-cube"></i>
          </div>
        </div>

        <h2 id="form-title" class="text-2xl font-black text-white">Acessar Conta</h2>
        <p id="form-subtitle" class="text-xs text-zinc-400 mt-1">
          Entre para acessar seus packs STL
        </p>
      </div>

      <form id="auth-form" class="space-y-5">
        <div>
          <label for="email-input" class="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-2">
            E-mail
          </label>

          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-zinc-500">
              <i class="fa-solid fa-envelope"></i>
            </span>

            <input
              id="email-input"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="seu@email.com"
              required
              class="w-full bg-[#0b0b0f] border border-[#292933] rounded-xl pl-11 pr-4 py-3.5 text-sm text-white focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition"
            >
          </div>
        </div>

        <div>
          <label for="password-input" class="block text-xs font-bold text-zinc-300 uppercase tracking-wider mb-2">
            Senha
          </label>

          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-zinc-500">
              <i class="fa-solid fa-lock"></i>
            </span>

            <input
              id="password-input"
              name="password"
              type="password"
              autocomplete="current-password"
              minlength="8"
              placeholder="Mínimo de 8 caracteres"
              required
              class="w-full bg-[#0b0b0f] border border-[#292933] rounded-xl pl-11 pr-4 py-3.5 text-sm text-white focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition"
            >
          </div>

          <p id="password-help" class="text-xs text-zinc-500 mt-2 hidden">
            Use pelo menos 8 caracteres.
          </p>
        </div>

        <p
          id="auth-message"
          role="status"
          aria-live="polite"
          class="hidden text-xs font-bold text-center mt-2 p-3 rounded-lg border"
        ></p>

        <button
          type="submit"
          id="submit-btn"
          class="w-full py-4 bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-500 hover:to-purple-600 text-white font-black text-sm rounded-xl shadow-lg shadow-purple-600/20 transition active:scale-95 mt-2 flex items-center justify-center gap-2"
        >
          <span id="btn-text">Entrar no Painel</span>
        </button>
      </form>

      <div class="text-center mt-6 pt-4 border-t border-[#292933]">
        <p id="toggle-text" class="text-xs text-zinc-400">
          Ainda não tem conta?
          <button
            id="toggle-mode-btn"
            type="button"
            class="text-purple-400 hover:text-purple-300 font-bold ml-1 underline underline-offset-2"
          >Criar conta agora</button>
        </p>
      </div>

      <p class="text-[11px] text-center text-zinc-500 mt-6">
        Ambiente de acesso TREZZY PAY
        <i class="fa-solid fa-shield-halved ml-1"></i>
      </p>
    </div>
  </div>

  <script>
    "use strict";

    /*
      Configuração pública do Supabase.
      A chave anon/publishable pode estar no frontend.
      NUNCA coloque uma chave service_role neste arquivo.
    */
    const SUPABASE_URL =
      "https://euiusibylgnrsglaqfph.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1aXVzaWJ5bGducnNnbGFxZnBoIiwiaWF0IjoxNzkyOTQ1MTExLCJleHAiOjIxMDg1MjExMTF9.exG4k4Zwt7VGBuLTZitagYL97aybaGMJxExg3Oetx64";

    let supabaseClient = null;
    let modoCriarConta = false;
    let processando = false;

    const elementos = {
      loading: document.getElementById("loading-screen"),
      formulario: document.getElementById("login-form"),
      authForm: document.getElementById("auth-form"),
      email: document.getElementById("email-input"),
      senha: document.getElementById("password-input"),
      mensagem: document.getElementById("auth-message"),
      botao: document.getElementById("submit-btn"),
      textoBotao: document.getElementById("btn-text"),
      titulo: document.getElementById("form-title"),
      subtitulo: document.getElementById("form-subtitle"),
      alternar: document.getElementById("toggle-mode-btn"),
      textoAlternar: document.getElementById("toggle-text"),
      ajudaSenha: document.getElementById("password-help")
    };

    function mostrarFormulario() {
      elementos.loading.style.display = "none";
      elementos.formulario.classList.remove("hidden");

      requestAnimationFrame(() => {
        elementos.formulario.style.opacity = "1";
      });
    }

    function mostrarMensagem(texto, sucesso = false) {
      elementos.mensagem.textContent = texto;

      elementos.mensagem.className =
        "text-xs font-bold text-center mt-2 p-3 rounded-lg border " +
        (sucesso
          ? "bg-emerald-950/40 border-emerald-900/50 text-emerald-400"
          : "bg-red-950/40 border-red-900/50 text-red-400");

      elementos.mensagem.classList.remove("hidden");
    }

    function ocultarMensagem() {
      elementos.mensagem.classList.add("hidden");
      elementos.mensagem.textContent = "";
    }

    function definirEstadoBotao(ocupado) {
      processando = ocupado;
      elementos.botao.disabled = ocupado;
      elementos.alternar.disabled = ocupado;

      if (ocupado) {
        elementos.textoBotao.innerHTML =
          '<i class="fa-solid fa-spinner animate-spin mr-2"></i> Processando...';
      } else {
        elementos.textoBotao.textContent =
          modoCriarConta ? "Criar Conta" : "Entrar no Painel";
      }
    }

    function alternarModo() {
      if (processando) return;

      modoCriarConta = !modoCriarConta;
      ocultarMensagem();

      elementos.titulo.textContent = modoCriarConta
        ? "Criar Nova Conta"
        : "Acessar Conta";

      elementos.subtitulo.textContent = modoCriarConta
        ? "Cadastre-se para acessar seus packs STL"
        : "Entre para acessar seus packs STL";

      elementos.textoBotao.textContent = modoCriarConta
        ? "Criar Conta"
        : "Entrar no Painel";

      elementos.senha.autocomplete = modoCriarConta
        ? "new-password"
        : "current-password";

      elementos.ajudaSenha.classList.toggle("hidden", !modoCriarConta);

      elementos.textoAlternar.replaceChildren(
        document.createTextNode(
          modoCriarConta
            ? "Já tem uma conta? "
            : "Ainda não tem conta? "
        )
      );

      const botaoAlternar = document.createElement("button");
      botaoAlternar.type = "button";
      botaoAlternar.className =
        "text-purple-400 hover:text-purple-300 font-bold ml-1 underline underline-offset-2";
      botaoAlternar.textContent = modoCriarConta
        ? "Fazer login"
        : "Criar conta agora";
      botaoAlternar.addEventListener("click", alternarModo);

      elementos.textoAlternar.appendChild(botaoAlternar);
    }

    async function processarAutenticacao(event) {
      event.preventDefault();

      if (processando) return;

      if (!supabaseClient) {
        mostrarMensagem(
          "Não foi possível conectar ao serviço de autenticação. Atualize a página e tente novamente."
        );
        return;
      }

      const email = elementos.email.value.trim();
      const password = elementos.senha.value;

      if (!email || !password) {
        mostrarMensagem("Preencha o e-mail e a senha.");
        return;
      }

      if (modoCriarConta && password.length < 8) {
        mostrarMensagem("A senha precisa ter pelo menos 8 caracteres.");
        return;
      }

      definirEstadoBotao(true);
      ocultarMensagem();

      try {
        if (modoCriarConta) {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo:
                window.location.origin + "/area-cliente.html"
            }
          });

          if (error) throw error;

          if (data.session) {
            window.location.replace("area-cliente.html");
            return;
          }

          mostrarMensagem(
            "Cadastro iniciado. Verifique seu e-mail para confirmar a conta antes de entrar.",
            true
          );

          elementos.senha.value = "";
        } else {
          const { error } =
            await supabaseClient.auth.signInWithPassword({
              email,
              password
            });

          if (error) throw error;

          window.location.replace("area-cliente.html");
          return;
        }
      } catch (error) {
        console.error("Erro de autenticação:", error);

        mostrarMensagem(
          "Não foi possível concluir a operação. Confira os dados e tente novamente."
        );
      } finally {
        definirEstadoBotao(false);
      }
    }

    async function inicializar() {
      try {
        if (!window.supabase?.createClient) {
          throw new Error("SDK do Supabase não foi carregado.");
        }

        if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
          throw new Error("Configuração do Supabase incompleta.");
        }

        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY,
          {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true
            }
          }
        );

        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) throw error;

        if (data.session) {
          window.location.replace("area-cliente.html");
          return;
        }
      } catch (error) {
        console.error("Inicialização do Supabase falhou:", error);

        mostrarMensagem(
          "O serviço de acesso está indisponível. Tente novamente mais tarde."
        );
      }

      mostrarFormulario();
    }

    elementos.authForm.addEventListener(
      "submit",
      processarAutenticacao
    );

    elementos.alternar.addEventListener(
      "click",
      alternarModo
    );

    window.addEventListener("DOMContentLoaded", inicializar);
  </script>
</body>
</html>
